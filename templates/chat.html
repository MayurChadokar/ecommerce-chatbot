

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Shopping Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- <link href="chatbot-style.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="/static/css/chatbot-style-sale.css">



    
</head>

<body>
    <!-- Chat Toggle Button -->
    <div class="chat-toggle" id="chatToggle">
        <i class="fas fa-comments"></i>
        <span class="notification-badge" id="notificationBadge">1</span>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="d-flex align-items-center">
                <div class="avatar me-3">
                    <i class="fas fa-headset"></i>
                </div>
                <div>
                    <h6 class="mb-0 text-white">Lotus Shopping Assistant</h6>
                    <small class="text-white-50">
                        <span class="status-indicator"></span>
                        Online now
                    </small>
                </div>
            </div>
            <div class="chat-header-actions">
                <button
                    type="button"
                    class="chat-back-btn"
                    aria-label="Back to Lotus Electronics"
                    onclick="window.opener ? window.close() : window.location.assign('https://www.lotuselectronics.com/')">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back</span>
                </button>
                <button class="btn btn-link text-white p-0" id="minimizeChat" aria-label="Minimize chat">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions" id="quickActions">
            <div class="row g-2">
                <div class="col-4">
                    <button class="quick-action-btn" data-category="television">
                        <i class="fas fa-tv"></i>
                        <span>Television</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="smartphone">
                        <i class="fas fa-mobile-alt"></i>
                        <span>Smartphone</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="laptop">
                        <i class="fas fa-laptop"></i>
                        <span>Laptop</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="homeappliance">
                        <i class="fas fa-home"></i>
                        <span>Home Ap.</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="kitchenappliance">
                        <i class="fas fa-blender"></i>
                        <span>Kitchen Ap.</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="ac">
                        <i class="fas fa-snowflake"></i>
                        <span>AC</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="recommend">
                        <i class="fas fa-wand-magic-sparkles"></i>
                        <span>Recommend</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="trackorder">
                        <i class="fas fa-truck-fast"></i>
                        <span>Track Order</span>
                    </button>
                </div>
                <div class="col-4">
                    <button class="quick-action-btn" data-category="raiseticket">
                        <i class="fas fa-headset"></i>
                        <span>Report Issue</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        <p class="mb-1">Hello! 👋 Welcome to Lotus Electronics!</p>
                        <p class="mb-0">What are you shopping for today? You can choose from the categories above or
                            type your question.</p>
                    </div>
                    <small class="message-time">Just now</small>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="message-avatar">
                <i class="fas fa-headset"></i>
            </div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Type your message..." id="messageInput">
                <button class="btn btn-primary" type="button" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Chat Footer -->
        <div class="chat-footer">
            <small class="text-muted">
                <i class="fas fa-shield-alt me-1"></i>
                Your conversations are secure and encrypted
            </small>
        </div>
    </div>

    <!-- Overlay -->
    <div class="chat-overlay" id="chatOverlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- <script src="chatbot.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="/static/js/chatbot-sale.js"></script>


</body>

</html>
